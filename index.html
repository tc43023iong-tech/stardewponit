<html lang="zh-Hant">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Miss Iong's Pokémon Class Points Manager</title>
    <meta name="description" content="A gamified classroom management system with Pokémon themes, student point tracking, bilingual commands, and data persistence." />
    <meta property="og:title" content="Miss Iong's Pokémon Class Points Manager" />

    <meta name="referrer" content="no-referrer" />
    <script>
      window.addEventListener('error', function(event) {
        var target = event.target;
        if (target && target.tagName === 'IMG' && !target.dataset.hasFallback) {
          target.dataset.hasFallback = 'true';
          var src = target.src || '';
          if (src.indexOf('/avatars/') !== -1) {
            target.src = 'https://miss-iongs-poke-mon-class-points-ma.vercel.app/avatars/' + src.split('/avatars/')[1].split('?')[0];
          } else if (src.indexOf('/backgrounds/') !== -1) {
            target.src = 'https://miss-iongs-poke-mon-class-points-ma.vercel.app/backgrounds/' + src.split('/backgrounds/')[1].split('?')[0];
          }
        }
      }, true);
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&family=Zen+Maru+Gothic:wght@500;700;900&family=Nunito:wght@600;800;900&family=Itim&family=Press+Start+2P&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  </body>
